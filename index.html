<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>YEYMAR FIGHTER</title>

<link rel="stylesheet"
      href="style.css">

</head>


<body>

<audio
    id="bgm"
    src="brute_force.mp3"
    loop
    preload="auto"
></audio>

<div id="app">


    <!-- ========================= -->
    <!-- MAIN MENU -->
    <!-- ========================= -->

    <section id="menuScreen"
             class="screen active">

        <div class="title">
            YEYMAR FIGHTER
        </div>

        <div class="subtitle">
            A Tiny Pixel Fighting Game For You
        </div>

        <div class="menu-buttons">

            <button id="startButton">
                START
            </button>

            <button id="howToButton">
                HOW TO PLAY
            </button>

        </div>

    </section>



    <!-- ========================= -->
    <!-- HOW TO PLAY -->
    <!-- ========================= -->

    <section id="howToScreen"
             class="screen">

        <div class="screen-title">
            HOW TO PLAY
        </div>

        <div class="instructions">

            <div>
                A / D &nbsp; — &nbsp; Move
            </div>

            <div>
                W &nbsp; — &nbsp; Jump
            </div>

            <div>
                J &nbsp; — &nbsp; Punch
            </div>

            <div>
                K &nbsp; — &nbsp; Kick
            </div>

            <div>
                S &nbsp; — &nbsp; Block
            </div>

        </div>

        <div class="enjoy">
            Enjoy your game!
        </div>

        <button id="backButton">
            BACK
        </button>

    </section>



    <!-- ========================= -->
    <!-- CHARACTER SELECT -->
    <!-- ========================= -->

    <section id="selectScreen"
             class="screen">

        <div class="screen-title">
            SELECT YOUR FIGHTER
        </div>


        <div class="fighters-select">


            <!-- CAT -->

            <button class="fighter-choice selected"
                    data-character="Cat">

                <img
                    class="profile-image"
                    src="Character/Cat/profile.png"
                    alt="小猫">

                <span>
                    小猫
                </span>

            </button>



            <!-- KIRYU -->

            <button class="fighter-choice"
                    data-character="Kiryu">

                <img
                    class="profile-image"
                    src="Character/Kiryu/profile.png"
                    alt="桐生">

                <span>
                    桐生
                </span>

            </button>



            <!-- KUGGA -->

            <button class="fighter-choice"
                    data-character="Kugga">

                <img
                    class="profile-image"
                    src="Character/Kugga/profile.png"
                    alt="空我">

                <span>
                    空我
                </span>

            </button>



            <!-- ZHAOYUN -->

            <button class="fighter-choice"
                    data-character="Zhaoyun">

                <img
                    class="profile-image"
                    src="Character/Zhaoyun/profile.png"
                    alt="赵云">

                <span>
                    赵云
                </span>

            </button>


        </div>


        <div class="selected-text">

            Selected:
            <strong id="selectedName">
                小猫
            </strong>

        </div>


        <div class="select-buttons">

            <button id="confirmButton">
                FIGHT!
            </button>

            <button id="selectBackButton"
                    class="secondary-button">

                BACK

            </button>

        </div>

    </section>



    <!-- ========================= -->
    <!-- FIGHT SCREEN -->
    <!-- ========================= -->

    <section id="fightScreen"
             class="screen fight-screen">


        <!-- HUD -->

        <div class="hud">


            <!-- PLAYER -->

            <div class="health-container">

                <div class="name"
                     id="playerName">

                    小猫

                </div>

                <div class="health">

                    <div
                        id="playerBar"
                        class="health-bar player-health">
                    </div>

                </div>

            </div>



            <!-- CPU -->

            <div class="health-container cpu-hud">

                <div class="name"
                     id="cpuName">

                    CPU

                </div>

                <div class="health">

                    <div
                        id="cpuBar"
                        class="health-bar cpu-health">
                    </div>

                </div>

            </div>


        </div>



        <!-- ========================= -->
        <!-- GAME STAGE -->
        <!-- ========================= -->

        <div id="game">


            <!-- FLOOR -->

            <div class="floor"></div>



            <!-- ========================= -->
            <!-- PLAYER -->
            <!-- ========================= -->

            <div id="player"
                 class="fighter player">

                <img
                    id="playerSprite"
                    src="Character/Cat/idle_01.png"
                    alt="Player">

            </div>



            <!-- ========================= -->
            <!-- CPU -->
            <!-- ========================= -->

            <div id="cpu"
                 class="fighter cpu">

                <img
                    id="cpuSprite"
                    src="Character/Kiryu/idle_01.png"
                    alt="CPU">

            </div>



            <!-- ========================= -->
            <!-- ROUND / END MESSAGE -->
            <!-- ========================= -->

            <div id="message"
                 class="message">

                <div id="resultText"></div>


                <button id="restartButton">
                    PLAY AGAIN
                </button>


                <button id="characterButton">
                    CHANGE CHARACTER
                </button>


                <button id="menuButton">
                    MAIN MENU
                </button>

            </div>


        </div>



        <!-- CONTROLS -->

        <div class="controls">

            A / D Move &nbsp; | &nbsp;
            W Jump &nbsp; | &nbsp;
            J Punch &nbsp; | &nbsp;
            K Kick &nbsp; | &nbsp;
            S Block

        </div>


    </section>


</div>


<script src="game.js"></script>


</body>

</html>
